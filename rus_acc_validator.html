<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Валидатор банковского счёта</title>
    <style>
        * {
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            backdrop-filter: blur(10px);
        }
        
        h1 {
            text-align: center;
            color: #4a5568;
            margin-bottom: 30px;
            font-size: 2.5em;
            font-weight: 300;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .form-group {
            margin-bottom: 25px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #4a5568;
            font-size: 1.1em;
        }
        
        input[type="text"] {
            width: 100%;
            padding: 15px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 16px;
            transition: all 0.3s ease;
            background: #f8fafc;
        }
        
        input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
            background: white;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
            transform: translateY(-2px);
        }
        
        .autocomplete {
            position: relative;
            margin-bottom: 20px;
        }
        
        #bic-results {
            position: absolute;
            border: 1px solid #e2e8f0;
            max-height: 250px;
            overflow-y: auto;
            width: 100%;
            background: white;
            z-index: 100;
            display: none;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            border: none;
        }
        
        .bic-result {
            padding: 15px;
            cursor: pointer;
            border-bottom: 1px solid #f1f5f9;
            transition: all 0.2s ease;
            font-size: 14px;
        }
        
        .bic-result:last-child {
            border-bottom: none;
        }
        
        .bic-result:hover {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            transform: translateX(5px);
        }
        
        .bic-result strong {
            color: #667eea;
            font-weight: 600;
        }
        
        .bic-result:hover strong {
            color: white;
        }
        
        .bank-info {
            padding: 20px;
            margin: 20px 0;
            background: linear-gradient(135deg, #f8fafc, #e2e8f0);
            border-radius: 15px;
            border-left: 5px solid #667eea;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
        }
        
        .bank-info h3 {
            margin: 0 0 10px 0;
            color: #4a5568;
            font-size: 1.3em;
        }
        
        .bank-info p {
            margin: 5px 0;
            color: #64748b;
        }
        
        .button-group {
            display: flex;
            gap: 15px;
            margin: 30px 0;
            flex-wrap: wrap;
        }
        
        button {
            padding: 15px 30px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            min-width: 140px;
        }
        
        #validate-btn {
            background: linear-gradient(135deg, #48bb78, #38a169);
            color: white;
            box-shadow: 0 5px 15px rgba(72, 187, 120, 0.3);
        }
        
        #validate-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(72, 187, 120, 0.4);
        }
        
        #test-btn {
            background: linear-gradient(135deg, #4299e1, #3182ce);
            color: white;
            box-shadow: 0 5px 15px rgba(66, 153, 225, 0.3);
        }
        
        #test-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(66, 153, 225, 0.4);
        }
        
        button:active {
            transform: translateY(-1px);
        }
        
        #result {
            padding: 20px;
            margin-top: 20px;
            border-radius: 15px;
            display: none;
            font-weight: 600;
            text-align: center;
            font-size: 1.1em;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            animation: slideIn 0.3s ease;
        }
        
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .valid { 
            background: linear-gradient(135deg, #c6f6d5, #9ae6b4);
            color: #22543d;
            border-left: 5px solid #48bb78;
        }
        
        .invalid { 
            background: linear-gradient(135deg, #fed7d7, #feb2b2);
            color: #742a2a;
            border-left: 5px solid #f56565;
        }
        
        /* Responsive design */
        @media (max-width: 768px) {
            body {
                padding: 10px;
            }
            
            .container {
                padding: 20px;
                border-radius: 15px;
            }
            
            h1 {
                font-size: 2em;
            }
            
            .button-group {
                flex-direction: column;
            }
            
            button {
                width: 100%;
            }
        }
        
        /* Custom scrollbar for BIC results */
        #bic-results::-webkit-scrollbar {
            width: 8px;
        }
        
        #bic-results::-webkit-scrollbar-track {
            background: #f1f5f9;
            border-radius: 4px;
        }
        
        #bic-results::-webkit-scrollbar-thumb {
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 4px;
        }
        
        #bic-results::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(135deg, #5a67d8, #6b46c1);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Проверка банковского счёта</h1>
        
        <div class="form-group autocomplete">
            <label for="bic">БИК банка:</label>
            <input type="text" id="bic" placeholder="Начните вводить БИК или название">
            <div id="bic-results"></div>
            <div id="bank-info" class="bank-info"></div>
        </div>
        
        <div class="form-group">
            <label for="account">Номер счёта (20 цифр):</label>
            <input type="text" id="account" placeholder="Введите номер счёта">
        </div>
        
        <div class="button-group">
            <button id="validate-btn">Проверить</button>
            <button id="test-btn">Тест загрузки БИК</button>
        </div>
        
        <div id="result"></div>
    </div>

    <script src="bic_data.js"></script>
    <script>
        // BIC data is now loaded from bic_data.js file
        // No need for fetch() or async loading
        
        // Autocomplete functionality
        const bicInput = document.getElementById('bic');
        const resultsContainer = document.getElementById('bic-results');
        const bankInfo = document.getElementById('bank-info');
        
        bicInput.addEventListener('input', function() {
            const query = this.value.trim().toLowerCase();
            resultsContainer.innerHTML = '';
            
            if (query.length < 2) {
                resultsContainer.style.display = 'none';
                return;
            }
            
            // Find matches in BIC or bank name
            const matches = Object.entries(bicDatabase)
                .filter(([bic, name]) => 
                    bic.includes(query) || 
                    name.toLowerCase().includes(query))
                .slice(0, 10);
            
            if (matches.length > 0) {
                matches.forEach(([bic, name]) => {
                    const div = document.createElement('div');
                    div.className = 'bic-result';
                    div.innerHTML = `<strong>${bic}</strong> - ${name}`;
                    div.addEventListener('click', () => {
                        bicInput.value = bic;
                        showBankInfo(bic, name);
                        resultsContainer.style.display = 'none';
                    });
                    resultsContainer.appendChild(div);
                });
                resultsContainer.style.display = 'block';
            } else {
                resultsContainer.style.display = 'none';
            }
        });
        
        function showBankInfo(bic, name) {
            bankInfo.innerHTML = `
                <h3>${name}</h3>
                <p><strong>БИК:</strong> ${bic}</p>
            `;
        }
        
        // Account validation
        function validateBankAccount(account, bic) {
            // Remove any non-digit characters
            account = account.replace(/\D/g, '');
            
            // Check if account is exactly 20 digits
            if (account.length !== 20) {
                return false;
            }
            
            // Extract BIC control digits (positions 7-9)
            const bicControlDigits = bic.substring(6, 9);
            
            // Create account key for validation
            // For Russian accounts: 3 digits from BIC + account number
            const accountKey = bicControlDigits + account;
            
            // Calculate checksum using Russian bank account algorithm
            const weights = [7, 1, 3, 7, 1, 3, 7, 1, 3, 7, 1, 3, 7, 1, 3, 7, 1, 3, 7, 1, 3, 7, 1];
            
            let sum = 0;
            for (let i = 0; i < accountKey.length; i++) {
                sum += parseInt(accountKey[i]) * weights[i];
            }
            
            // Check if sum is divisible by 10
            return sum % 10 === 0;
        }
        
        // Setup validation button
        document.getElementById('validate-btn').addEventListener('click', function() {
            const account = document.getElementById('account').value.trim();
            const bic = document.getElementById('bic').value.trim();
            
            if (!bic || !account) {
                showResult('Введите БИК и номер счёта', false);
                return;
            }
            
            if (!(bic in bicDatabase)) {
                showResult('БИК не найден в справочнике', false);
                return;
            }
            
            const isValid = validateBankAccount(account, bic);
            showResult(isValid ? 'Счёт корректный' : 'Счёт некорректный', isValid);
        });
        
        // Setup test button
        document.getElementById('test-btn').addEventListener('click', function() {
            if (Object.keys(bicDatabase).length === 0) {
                showResult('БИК данные не загружены!', false);
                return;
            }
            
            const sampleBICs = Object.entries(bicDatabase).slice(0, 3);
            const sampleText = sampleBICs.map(([bic, name]) => `${bic}: ${name}`).join('\n');
            showResult(`БИК данные загружены успешно!\nЗагружено: ${Object.keys(bicDatabase).length} записей\n\nПримеры:\n${sampleText}`, true);
        });
        
        function showResult(message, isValid) {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = message.replace(/\n/g, '<br>');
            resultDiv.className = isValid ? 'valid' : 'invalid';
            resultDiv.style.display = 'block';
        }
        
        // Initialize - check if BIC data is loaded
        if (typeof bicDatabase !== 'undefined' && Object.keys(bicDatabase).length > 0) {
            console.log(`BIC data loaded successfully: ${Object.keys(bicDatabase).length} entries`);
        } else {
            console.error('BIC data not loaded! Check if bic_data.js file exists and is included correctly.');
            document.getElementById('bank-info').innerHTML = 
                '<div style="color: red;">Ошибка: Файл bic_data.js не найден или не загружен</div>';
        }
    </script>
</body>
</html>
